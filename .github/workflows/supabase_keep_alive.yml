name: Keep Supabase Awake

on:
  schedule:
    # Runs at midnight UTC every Sunday and Thursday
    - cron: '0 0 * * 0,4'
  workflow_dispatch:

jobs:
  ping_db:
    runs-on: ubuntu-latest
    steps:
      - name: Send API request to database
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS -X GET \
            "https://ctbqjdqtrdthiqgsblsb.supabase.co/rest/v1/records?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}"
