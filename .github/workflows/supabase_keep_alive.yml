name: Keep Supabase Awake

on:
  schedule:
    # Runs daily at 04:00 UTC to ensure project never reaches the 7-day pause window
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  ping_db:
    runs-on: ubuntu-latest
    steps:
      - name: Send API request to database
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl -fsS --retry 3 --retry-delay 5 \
            -X GET "https://ctbqjdqtrdthiqgsblsb.supabase.co/rest/v1/records?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}"
          echo "Supabase database pinged successfully."
